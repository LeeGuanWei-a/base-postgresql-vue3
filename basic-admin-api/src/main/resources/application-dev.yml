# 项目相关配置
basic:
  # 名称
  name: basic
  # 版本
  version: 3.9.2
  # 版权年份
  copyrightYear: 2022
  # 实例演示开关
  demoEnabled: false
  # 文件路径 示例（ Windows配置D:/basic/uploadPath，Linux配置 /home/basic/uploadPath）
  profile: D:/basic/uploadPath
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数组计算 char 字符验证
  captchaType: math

  # ============================================================
  # 第三方渠道集成（extend-wecom / extend-alipay）
  # ============================================================
  # 企微：不配也能启动（apps 为空 map 注入），调用时会 404 提示
  wecom:
    # 企业 corp_id（从企业微信管理后台"我的企业 > 企业信息"复制）
    corp-id: ${WECOM_CORP_ID:ww-dev-placeholder}
    # 通讯录同步专用 secret（可选；通讯录类 API 必须用这个 secret 而非自建应用 secret）
    contacts-secret: ${WECOM_CONTACTS_SECRET:}
    # 自建应用列表：每个应用是一对 (agentId, secret)
    # agentId/secret 从"应用管理 > 自建应用 > 详情"获取
    apps:
      - agent-id: 1000001
        name: 公告推送
        secret: ${WECOM_APP1_SECRET:dev-placeholder-secret-1}
      # 第二个应用示例，需要时放开
      # - agent-id: 1000002
      #   name: 审批回调
      #   secret: ${WECOM_APP2_SECRET}

  # 支付宝：必须配置；私钥/公钥缺失会导致签名失败
  alipay:
    # 网关：生产 https://openapi.alipay.com/gateway.do
    # 沙箱 https://openapi.alipaydev.com/gateway.do
    gateway: https://openapi.alipaydev.com/gateway.do
    sign-type: RSA2
    charset: UTF-8
    apps:
      - app-id: 2021000000000000
        name: 沙箱应用
        # PKCS#8 私钥，\n 保留换行
        private-key: ${ALIPAY_PRIVATE_KEY:}
        # 公钥模式必填；证书模式留空
        alipay-public-key: ${ALIPAY_PUBLIC_KEY:}
        # 证书模式三个文件路径（三者全填才进入证书模式，否则按公钥模式走）
        app-cert-path: ${ALIPAY_APP_CERT:}
        alipay-cert-path: ${ALIPAY_CERT:}
        alipay-root-cert-path: ${ALIPAY_ROOT_CERT:}
        notify-url: http://localhost:8080/alipay/notify
        return-url: http://localhost:8080/alipay/return

# 数据源配置
spring:
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: false
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    #删除默认会自动识别驱动
    #        driverClassName: com.mysql.cj.jdbc.Driver
    druid:
      # 主库数据源
      master:
        url: jdbc:postgresql://192.168.170.125:54321/basicdb-vue3?useSSL=false&currentSchema=basicdb
        username: system
        password: '12354'
        validationQuery: SELECT 1
      # 从库数据源
      slave:
        # 从数据源开关/默认关闭
        enabled: false
        url:
        username:
        password:
        validationQuery: SELECT 1 FROM DUAL
      # 初始连接数
      initialSize: 5
      # 最小连接池数量
      minIdle: 10
      # 最大连接池数量
      maxActive: 100
      # 配置获取连接等待超时的时间
      maxWait: 60000
      # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
      timeBetweenEvictionRunsMillis: 60000
      # 配置一个连接在池中最小生存的时间，单位是毫秒
      minEvictableIdleTimeMillis: 300000
      # 配置一个连接在池中最大生存的时间，单位是毫秒
      maxEvictableIdleTimeMillis: 900000
      # 配置检测连接是否有效
      validationQuery: SELECT 1
      testWhileIdle: true
      testOnBorrow: false
      testOnReturn: false
      webStatFilter:
        enabled: false
      statViewServlet:
        enabled: true
        # 设置白名单，不填则允许所有访问
        allow:
        url-pattern: /druid/*
        # 控制台管理用户名和密码
        login-username: basic
        login-password: 123456
      filter:
        stat:
          enabled: true
          # 慢SQL记录
          log-slow-sql: true
          slow-sql-millis: 1000
          merge-sql: false
        wall:
          config:
            multi-statement-allow: true
  # redis 配置 (Spring Boot 3 使用 spring.data.redis 而非 spring.redis)
  data:
    redis:
      # 地址
      host: 192.168.170.125
      # 端口，默认为6379
      port: 6379
      # 数据库索引
      database: 12
      # 密码
      password:
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # #连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms
