# 项目相关配置
basic:
  # 名称
  name: basic
  # 版本
  version: 3.9.2
  # 版权年份
  copyrightYear: 2022
  # 实例演示开关
  demoEnabled: false
  # 文件路径 示例（ Windows配置D:/basic/uploadPath，Linux配置 /home/basic/uploadPath）
  profile: /home/basic/uploadPath
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数组计算 char 字符验证
  captchaType: math

# 日志配置
logging:
  file:
    path: /home/basic/logs
  config: classpath:logback-spring.xml

# 数据源配置
spring:
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: false
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    #删除默认会自动识别驱动
    #        driverClassName: com.mysql.cj.jdbc.Driver
    druid:
      # 主库数据源
      master:
        url: jdbc:mysql://192.168.170.129:5102/yjy_base?allowMultiQueries=true&useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
        username: yjy_root_user
        password: '@38#S97787df'
        validationQuery: SELECT 1
      # 从库数据源
      slave:
        # 从数据源开关/默认关闭
        enabled: false
        url:
        username:
        password:
        validationQuery: SELECT 1 FROM DUAL
      # 初始连接数
      initialSize: 5
      # 最小连接池数量
      minIdle: 10
      # 最大连接池数量
      maxActive: 100
      # 配置获取连接等待超时的时间
      maxWait: 60000
      # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
      timeBetweenEvictionRunsMillis: 60000
      # 配置一个连接在池中最小生存的时间，单位是毫秒
      minEvictableIdleTimeMillis: 60000
      # 配置一个连接在池中最大生存的时间，单位是毫秒
      maxEvictableIdleTimeMillis: 300000
      # 配置检测连接是否有效
      validationQuery: SELECT 1
      testWhileIdle: true
      testOnBorrow: false
      testOnReturn: false
      webStatFilter:
        enabled: false
      statViewServlet:
        enabled: false
        # 设置白名单，不填则允许所有访问
        allow:
        url-pattern: /druid/*
        # 控制台管理用户名和密码
        login-username: basic
        login-password: 123456
      filter:
        stat:
          enabled: true
          # 慢SQL记录
          log-slow-sql: true
          slow-sql-millis: 1000
          merge-sql: false
        wall:
          config:
            multi-statement-allow: true
  # redis 配置 (Spring Boot 3 使用 spring.data.redis)
  data:
    redis:
      # 地址
      host: 192.168.170.129
      # 端口，默认为6379
      port: 5109
      # 数据库索引
      database: 1
      # 密码
      password: 'fs@YJY2021'
      # 连接超时时间
      timeout: 10s
      jedis:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 5
          # 连接池中的最大空闲连接
          max-idle: 10
          # 连接池的最大数据库连接数
          max-active: 100
          # #连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms

# ============================================================
# springdoc-openapi：生产环境关闭
#   /v3/api-docs、/swagger-ui/** 在 SecurityConfig 里是 permitAll 的（联调方便），
#   生产必须关掉，避免把全部接口清单和调试页面暴露给任何能访问端口的人。
#   需要临时看文档时，用启动参数 --springdoc.api-docs.enabled=true 单独放开。
# ============================================================
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false