# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 10

# Spring配置
spring:
  main:
    allow-bean-definition-overriding: true
  cache:
    ehcache:
      config: classpath:/ehcache/flow-ehcache.xml
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles: 
    active: dev
  # 文件上传
  servlet:
     multipart:
       # 单个文件大小
       max-file-size:  10MB
       # 设置总上传的文件大小
       max-request-size:  20MB
  jackson:
    # 日期格式化
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      # 格式化输出
      indent_output: false
      # 忽略无法转换的对象
      fail_on_empty_beans: false
    deserialization:
      # 允许对象忽略json中不存在的属性
      fail_on_unknown_properties: false
    # 当前时区
    locale: zh
    # 设置全局时区
    time-zone: GMT+8

# token配置
token:
    # 令牌自定义标识
    header: Authorization
    # 令牌密钥 生产环境请修改密钥(切勿使用默认值)
    secret: FE0xdyiJWkasfCB36TwNze5QL4grpRulVXP29hYS7ntjqZv81HAGIKMocOUmDb
    # 令牌有效期（默认30分钟）
    expireTime: 30
  
# MyBatis配置
#mybatis:
