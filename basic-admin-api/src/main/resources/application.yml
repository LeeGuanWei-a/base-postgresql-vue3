#    typeAliasesPackage: com.basic.**.domain
#    # 配置mapper的扫描，找到所有的mapper.xml映射文件
#    mapperLocations: classpath*:mapper/**/*Mapper.xml
#    # 加载全局的配置文件
#    configLocation: classpath:mybatis/mybatis-config.xml

# MyBatis Plus配置
mybatis-plus:
  # 搜索指定包别名
  typeAliasesPackage: com.basic.**.domain, com.core.**.domain, com.core.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml,classpath:/META-INF/flow-mybatis-mappings/*/xml/*.xml,classpath:/META-INF/modeler-mybatis-mappings/*.xml
  # 加载全局的配置文件（Flowable Modeler XML 引用 ${blobType} / ${boolValue}）
  configuration-properties:
    blobType: BLOB
    boolValue: TRUE
    prefix:
#  configLocation: classpath:mybatis/mybatis-config.xml
  global-config:
    db-config:
      #主键类型  AUTO 自增 NONE 空 INPUT 用户输入 ASSIGN_ID 雪花 ASSIGN_UUID 唯一 UUID;
      id-type: ASSIGN_ID
      #逻辑删除配置
      logic-delete-value: 2
      logic-not-delete-value: 0
      # IGNORED 忽略 NOT_NULL 非NULL NOT_EMPTY 非空 DEFAULT 默认 NEVER 不加入 SQL
      insertStrategy: NOT_NULL
      # 字段验证策略之 update,在 update 的时候的字段验证策略
      updateStrategy: NOT_NULL
      # 字段验证策略之 select,在 select 的时候的字段验证策略既 wrapper 根据内部 entity 生成的 where 条件
      where-strategy: NOT_NULL
    configuration:
      jdbc-type-for-null: 'null'
      #数据库大写下划线转换
      map-underscore-to-camel-case: true
      call-setters-on-nulls: true
      cache-enabled: false
#      log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl #开启sql日志


# PageHelper分页插件
pagehelper:
  #自动识别数据源
#  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql
  # 表示运行时获取数据源 注释helperDialect: mysql搭配使用
  autoRuntimeDialect: true

# Swagger配置
swagger:
  # 是否开启swagger
  enabled: true
  # 请求前缀
  pathMapping: /dev-api

# 防止XSS攻击
xss: 
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

management:
  endpoint:
    shutdown:
      enabled: true
  endpoints:
    web:
      exposure:
        include: "shutdown"
      base-path: /monito

# Flowable 配置
flowable:
  # 异步执行器开启
  async-executor-activate: true
  # 库与数据库表结构不一致时，会自动将数据库表结构升级至新版本
  database-schema-update: true
  idm:
    enabled: false
  common:
    app:
      idm-admin:
        password: test
        user: test
      idm-url: http://localhost:8080/flowable-demo
