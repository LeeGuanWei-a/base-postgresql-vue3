# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles: 
    active: dev
  # 文件上传
  servlet:
     multipart:
       # 单个文件大小
       max-file-size:  10MB
       # 设置总上传的文件大小
       max-request-size:  20MB
  jackson:
    # 日期格式化
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      # 格式化输出
      indent_output: false
      # 忽略无法转换的对象
      fail_on_empty_beans: false
    deserialization:
      # 允许对象忽略json中不存在的属性
      fail_on_unknown_properties: false
    # 当前时区
    locale: zh
    # 设置全局时区
    time-zone: GMT+8

# ============================================================
# Flowable 7.2 流程引擎配置
# 说明：Flowable 7.2 的可用配置键以 flowable-spring-boot-autoconfigure 7.2.0 的
#      spring-configuration-metadata.json 为准，写错的键会被 Spring 静默忽略。
# 联调环境用 database-schema-update: true 自动建表；生产请改为 false 并用
#      file-sql/basicdb-vue3-flowable7.sql 初始化。
# ============================================================
flowable:
  # 启动时检查/同步表结构：true=自动建表/增量更新；false=不检查
  database-schema-update: true
  # 历史级别（audit：流程实例 + 变量 + 表单属性）
  history-level: audit
  # 关闭"自动部署 resources/processes 下的 BPMN"——本仓库没有该目录
  check-process-definitions: false
  # 锁定 Flowable 表归属的 schema，与 JDBC URL 的 currentSchema 保持一致
  database-schema: basicdb_flowable7
  # 关闭 Flowable 自带的 IDM（用户/角色/权限表）。
  # 注意：Flowable 7 的正确键是 flowable.idm.enabled；
  #      历史写法 flowable.common.app.idm-enabled 是无效键（会被静默忽略，仍会建 ACT_ID_* 表）。
  #      已建出来的 ACT_ID_* 表不影响运行，可保留，也可手工删除。
  idm:
    enabled: false
  # 关闭 Form Service 的字段强校验（业务侧 wf_form 走自定义 JSON 校验）
  form-field-validation-enabled: false
  # 说明：Flowable 7 的 REST 端点由独立的 flowable-spring-boot-starter-rest-api 提供，
  #      本项目不引入该 starter，因此无需（也没有）*-rest-api-enabled 这类开关。

# token配置
token:
    # 令牌自定义标识
    header: Authorization
    # 令牌密钥 生产环境请修改密钥(切勿使用默认值)
    secret: FE0xdyiJWkasfCB36TwNze5QL4grpRulVXP29hYS7ntjqZv81HAGIKMocOUmDb
    # 令牌有效期（默认30分钟）
    expireTime: 30

# MyBatis Plus配置
mybatis-plus:
  # 搜索指定包别名
  typeAliasesPackage: com.basic.**.domain, com.core.**.domain, com.core.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml,classpath*:mapper/*Mapper.xml
  # 加载全局的配置文件
#  configLocation: classpath:mybatis/mybatis-config.xml
  global-config:
    db-config:
      #主键类型  AUTO 自增 NONE 空 INPUT 用户输入 ASSIGN_ID 雪花 ASSIGN_UUID 唯一 UUID;
      id-type: ASSIGN_ID
      #逻辑删除配置
      logic-delete-value: 2
      logic-not-delete-value: 0
      # IGNORED 忽略 NOT_NULL 非NULL NOT_EMPTY 非空 DEFAULT 默认 NEVER 不加入 SQL
      insertStrategy: NOT_NULL
      # 字段验证策略之 update,在 update 的时候的字段验证策略
      updateStrategy: NOT_NULL
      # 字段验证策略之 select,在 select 的时候的字段验证策略既 wrapper 根据内部 entity 生成的 where 条件
      where-strategy: NOT_NULL
    configuration:
      jdbc-type-for-null: 'null'
      #数据库大写下划线转换
      map-underscore-to-camel-case: true
      call-setters-on-nulls: true
      cache-enabled: false
#      log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl #开启sql日志


# PageHelper分页插件
pagehelper:
  #自动识别数据源
#  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql
  # 表示运行时获取数据源 注释helperDialect: mysql搭配使用
  autoRuntimeDialect: true

# ============================================================
# springdoc-openapi 配置（取代原 springfox）
# 访问地址：http://host:port/swagger-ui/index.html
# 默认无需开启，springdoc 自动装配
# ============================================================
springdoc:
  api-docs:
    # OpenAPI JSON 路径
    path: /v3/api-docs
  swagger-ui:
    # Swagger UI 路径
    path: /swagger-ui/index.html
    # 展示 operationId
    operationsSorter: method
    tags-sorter: alpha

# 防止XSS攻击
xss: 
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

management:
  endpoint:
    shutdown:
      enabled: true
  endpoints:
    web:
      exposure:
        include: "shutdown"
      base-path: /monito
